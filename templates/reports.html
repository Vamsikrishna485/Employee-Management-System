<!DOCTYPE html>
<html>

<head>

<title>Reports</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

<h2 class="mb-4">

Employee Reports

</h2>

<div class="row">

<div class="col-md-3">

<div class="card bg-primary text-white">

<div class="card-body">

<h5>Total Employees</h5>

<h2>{{ total }}</h2>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card bg-success text-white">

<div class="card-body">

<h5>Average Salary</h5>

<h2>₹{{ average }}</h2>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card bg-warning">

<div class="card-body">

<h5>Highest Salary</h5>

<h2>₹{{ maximum }}</h2>

</div>

</div>

</div>

<div class="col-md-3">

<div class="card bg-danger text-white">

<div class="card-body">

<h5>Lowest Salary</h5>

<h2>₹{{ minimum }}</h2>

</div>

</div>

</div>

</div>

<br>

<a href="/dashboard" class="btn btn-secondary">

Back

</a>

</div>

</body>

</html>
