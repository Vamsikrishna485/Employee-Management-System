<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body style="background:#f4f7fb;">

<!-- Navbar -->

<nav class="navbar navbar-dark bg-primary shadow">

    <div class="container-fluid">

        <span class="navbar-brand fw-bold">

            Employee Management System

        </span>

        <a href="/logout" class="btn btn-light">

            Logout

        </a>

    </div>

</nav>

<!-- Content -->

<div class="container mt-4">

    <div class="row g-4">

        <div class="col-md-3">

            <div class="card shadow border-0">

                <div class="card-body text-center">

                    <i class="fa-solid fa-users fa-3x text-primary mb-3"></i>

                    <h5>Total Employees</h5>

                    <h2>{{ total_employees }}</h2>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card shadow border-0">

                <div class="card-body text-center">

                    <i class="fa-solid fa-building fa-3x text-success mb-3"></i>

                    <h5>Departments</h5>

                    <h2>{{ total_departments }}</h2>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card shadow border-0">

                <div class="card-body text-center">

                    <i class="fa-solid fa-money-bill fa-3x text-danger mb-3"></i>

                    <h5>Payroll</h5>

                    <h2>₹{{ total_salary }}</h2>

                </div>

            </div>

        </div>

        <div class="col-md-3">

            <div class="card shadow border-0">

                <div class="card-body text-center">

                    <i class="fa-solid fa-chart-line fa-3x text-warning mb-3"></i>
                    <h5>Average Salary</h5>
                    <h2>₹{{ average_salary }}</h2>


                </div>

            </div>

        </div>

    </div>

    <hr class="my-5">

    <div class="row">

        <div class="col-lg-4 mb-3">

            <a href="/add" class="btn btn-primary w-100 p-3">

                <i class="fa-solid fa-user-plus"></i>

                Add Employee

            </a>

        </div>

        <div class="col-lg-4 mb-3">

            <a href="/employees" class="btn btn-success w-100 p-3">

                <i class="fa-solid fa-users"></i>

                View Employees

            </a>

        </div>

        <div class="col-lg-4 mb-3">

            <a href="#" class="btn btn-warning w-100 p-3">

                <i class="fa-solid fa-magnifying-glass"></i>

                Search Employee

            </a>

        </div>
        <div class="col-lg-4 mb-3">

    <a href="/reports" class="btn btn-info w-100 p-3">

        <i class="fa-solid fa-chart-column"></i>

        Reports

    </a>

</div>

    </div>

</div>

</body>

</html>
