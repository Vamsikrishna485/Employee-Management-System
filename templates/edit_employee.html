<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Employee</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-warning text-dark">

            <h3>Edit Employee</h3>

        </div>

        <div class="card-body">

            <form action="/update_employee/{{ employee.id }}" method="POST">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label>Name</label>
                        <input type="text" class="form-control" name="name" value="{{ employee.name }}" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Email</label>
                        <input type="email" class="form-control" name="email" value="{{ employee.email }}" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Phone</label>
                        <input type="text" class="form-control" name="phone" value="{{ employee.phone }}" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Department</label>
                        <input type="text" class="form-control" name="department" value="{{ employee.department }}" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Designation</label>
                        <input type="text" class="form-control" name="designation" value="{{ employee.designation }}" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Salary</label>
                        <input type="number" class="form-control" name="salary" value="{{ employee.salary }}" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Gender</label>

                        <select class="form-select" name="gender">

                            <option {% if employee.gender=="Male" %}selected{% endif %}>Male</option>

                            <option {% if employee.gender=="Female" %}selected{% endif %}>Female</option>

                            <option {% if employee.gender=="Other" %}selected{% endif %}>Other</option>

                        </select>

                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Joining Date</label>
                        <input type="date" class="form-control" name="joining_date" value="{{ employee.joining_date }}">
                    </div>

                    <div class="col-12 mb-3">
                        <label>Address</label>
                        <textarea class="form-control" name="address" rows="3">{{ employee.address }}</textarea>
                    </div>

                </div>

                <button class="btn btn-warning">
                    Update Employee
                </button>

                <a href="/employees" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

</body>

</html>
